# CI matrix for the modernization waves (W4-C).
# Runs the credential-free test suite and the smoke test on every push/PR
# to main. No secrets, no deploy steps.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        experimental: [false]
        include:
          - python-version: "3.14"
            experimental: true

    continue-on-error: ${{ matrix.experimental }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # requirements.txt intentionally includes git+https:// pins (e.g. the
      # pinned Telethon fork); pip installs them directly from the public repos.
      # pytest and pytest-asyncio are installed explicitly because the [dev]
      # extra is optional; the pipeline suite's @pytest.mark.asyncio tests
      # need pytest-asyncio (it only arrives transitively via the optional
      # akipy plugin dependency, which CI never installs).
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest pytest-asyncio

      - name: Run test suite
        run: python -m pytest tests/ -q

      - name: Run smoke test
        run: python smoke_test.py
